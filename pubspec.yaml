name: classai
description: Offline-first AI teaching assistant for Nigerian schools
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Database
  drift: ^2.31.0
  # Drift 2.x still uses sqlite3 2.x, so keep the matching Flutter libs package.
  sqlite3_flutter_libs: ^0.5.42

  # Platform & Device
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^7.1.1
  battery_plus: ^7.0.0
  device_info_plus: ^13.1.0

  # Cloud & HTTP
  supabase_flutter: ^2.12.4
  dio: ^5.9.2

  # AI
  google_generative_ai: ^0.4.7
  http: ^1.6.0

  # Documents
  pdf: ^3.12.0
  printing: ^5.14.3

  # Media
  flutter_image_compress: ^2.4.0
  image_picker: ^1.2.2

  # Secure Storage & Biometrics
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.5.5
  local_auth: ^3.0.1

  # Cryptography (pure Dart, cross-platform, Argon2id built-in)
  cryptography: ^2.9.0
  crypto: ^3.0.7
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.3
  google_fonts: ^8.1.0
  json_annotation: ^4.11.0
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  app_links: ^6.3.2

  # Monitoring
  sentry_flutter: ^8.14.2

  # URL Launching
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  drift_dev: ^2.31.0
  json_serializable: ^6.13.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
