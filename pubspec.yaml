name: classai
description: Offline-first AI teaching assistant for Nigerian schools
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^3.3.1

  # Database
  drift: ^2.31.0
  # SQLCipher-native build for the sqlite3 2.x line used by Drift 2.x.
  # NOTE: 0.7.0+ is a deprecated no-op; 0.6.8 is the last version that actually
  # bundles the SQLCipher 4.10.0 native library. Keep pinned to 0.6.8.
  sqlcipher_flutter_libs: 0.6.8

  # Platform & Device
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^7.1.1
  device_info_plus: ^13.1.0

  # Cloud & HTTP
  supabase_flutter: ^2.12.4
  dio: ^5.9.2

  # AI
  http: ^1.6.0

  # Documents
  pdf: ^3.12.0
  file_selector: ^1.0.3

  # Media
  flutter_image_compress: ^2.4.0
  image_picker: ^1.2.2

  # Secure Storage & Biometrics
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.5.5
  flutter_cache_manager: ^3.4.1
  local_auth: ^3.0.1

  # Cryptography (pure Dart, cross-platform, Argon2id built-in)
  cryptography: ^2.9.0
  crypto: ^3.0.7

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.3
  google_fonts: ^8.1.0
  go_router: ^17.2.3
  app_links: ^6.3.2
  package_info_plus: ^10.1.0
  share_plus: ^13.2.0

  # Monitoring
  sentry_flutter: ^8.14.2

  # URL Launching
  url_launcher: ^6.3.0

  # Markdown rendering
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  drift_dev: ^2.31.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  # Required by test/database/db_encryption_bootstrap_test.dart to provide an
  # in-memory fake for flutter_secure_storage's platform interface.
  flutter_secure_storage_platform_interface: ^2.0.1

flutter:
  uses-material-design: true
